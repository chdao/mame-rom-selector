name: Create Release

on:
  push:
    branches: [ master ]
    paths: [ 'MameSelector/MameSelector.csproj' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v0.4.5)'
        required: true
        default: 'v0.4.5'
      release_notes:
        description: 'Release notes'
        required: false
        default: 'Bug fixes and improvements'

jobs:
  create-release:
    runs-on: windows-latest
    permissions:
      contents: write
      packages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Extract version from project file
      id: version
      run: |
        $version = Select-Xml -Path "MameSelector/MameSelector.csproj" -XPath "//AssemblyVersion" | Select-Object -ExpandProperty Node | Select-Object -ExpandProperty InnerText
        $version = $version -replace '\.0$', ''  # Remove trailing .0
        $version = "v$version"
        echo "version=$version" >> $env:GITHUB_OUTPUT
        echo "Extracted version: $version"
    
    - name: Check if release already exists
      id: check_release
      run: |
        $version = "${{ steps.version.outputs.version }}"
        $releases = gh release list --limit 100
        $exists = $releases | Select-String -Pattern "^$version\s"
        if ($exists) {
          echo "Release $version already exists, skipping..."
          echo "skip=true" >> $env:GITHUB_OUTPUT
        } else {
          echo "Release $version does not exist, proceeding..."
          echo "skip=false" >> $env:GITHUB_OUTPUT
        }
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Generate release notes
      if: steps.check_release.outputs.skip == 'false'
      id: release_notes
      run: |
        # Set error action preference to continue on errors
        $ErrorActionPreference = "Continue"
        
        # Get the last release tag with multiple fallback methods
        $lastTag = $null
        
        # Method 1: Try using GitHub CLI to get the latest release
        try {
          $releaseData = gh release list --limit 1 --json tagName 2>$null | ConvertFrom-Json
          if ($releaseData -and $releaseData.Count -gt 0) {
            $lastTag = $releaseData[0].tagName
            Write-Host "Found latest release tag via gh: $lastTag"
          }
        }
        catch {
          Write-Host "GitHub CLI method failed: $($_.Exception.Message)"
        }
        
        # Method 2: Try git describe if gh failed
        if (-not $lastTag) {
          try {
            $lastTag = git describe --tags --abbrev=0 2>$null
            if ($lastTag) {
              Write-Host "Found tag via git describe: $lastTag"
            }
          }
          catch {
            Write-Host "git describe failed: $($_.Exception.Message)"
          }
        }
        
        # Method 3: Get all tags and find the latest one
        if (-not $lastTag) {
          try {
            $allTags = git tag --list 2>$null
            if ($allTags) {
              # Filter for version tags and sort them
              $versionTags = $allTags | Where-Object { $_ -match '^v?\d+\.\d+\.\d+' }
              if ($versionTags) {
                $lastTag = $versionTags | Sort-Object { [version]($_ -replace '^v', '') } | Select-Object -Last 1
                Write-Host "Found latest version tag: $lastTag"
              }
            }
          }
          catch {
            Write-Host "Getting tags failed: $($_.Exception.Message)"
          }
        }
        
        # Fallback if no tag found
        if (-not $lastTag) {
          Write-Host "No previous release found, using HEAD~10 as fallback"
          $lastTag = "HEAD~10"
        }
        
        # Generate changelog from commit messages with better error handling
        $commits = @()
        
        try {
          if ($lastTag -eq "HEAD~10") {
            # Get last 10 commits
            $commits = git log --pretty=format:"- %s" -10 2>$null
            Write-Host "Getting last 10 commits"
          } else {
            # Get commits since the last tag
            Write-Host "Getting commits since tag: $lastTag"
            $commits = git log --pretty=format:"- %s" "$lastTag..HEAD" 2>$null
            
            # If that fails, try without the range
            if (-not $commits) {
              Write-Host "Range query failed, trying last 10 commits"
              $commits = git log --pretty=format:"- %s" -10 2>$null
            }
          }
        }
        catch {
          Write-Host "Error getting commits: $($_.Exception.Message)"
          # Final fallback
          $commits = git log --pretty=format:"- %s" -10 2>$null
        }
        
        # Create changelog
        if ($commits -and $commits.Count -gt 0) {
          $changelog = "## Changes in this release:`n`n$($commits -join "`n")"
          Write-Host "Generated changelog with $($commits.Count) commits"
        } else {
          $changelog = "## Changes in this release`n`n- Version update and improvements"
          Write-Host "Using default changelog"
        }
        
        # Output for GitHub Actions
        Write-Host "release_notes<<EOF" >> $env:GITHUB_OUTPUT
        Write-Host $changelog >> $env:GITHUB_OUTPUT
        Write-Host "EOF" >> $env:GITHUB_OUTPUT
        
        Write-Host "Release notes generation completed successfully"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
    - name: Setup .NET
      if: steps.check_release.outputs.skip == 'false'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
        
    - name: Build Windows
      if: steps.check_release.outputs.skip == 'false'
      run: dotnet publish MameSelector/MameSelector.csproj --configuration Release --runtime win-x64 --self-contained true --output ./publish/win-x64
        
    - name: Create Release
      if: steps.check_release.outputs.skip == 'false'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ github.event.inputs.version || steps.version.outputs.version }}
        name: MAME ROM Selector ${{ github.event.inputs.version || steps.version.outputs.version }}
        body: |
          ## MAME ROM Selector ${{ github.event.inputs.version || steps.version.outputs.version }}
          
          ${{ github.event.inputs.release_notes || steps.release_notes.outputs.release_notes }}
          
          ### Download:
          - **Windows**: Download `MameSelector.exe`
          
          ### Installation:
          1. Download the Windows executable
          2. Run `MameSelector.exe`
          
          ### Requirements:
          - .NET 8.0 Runtime (included in self-contained build)
          - Windows 10/11
        files: ./publish/win-x64/MameSelector.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

